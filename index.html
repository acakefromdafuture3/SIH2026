<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResQ — Disaster Relocation & Priority Decision Support System</title>
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans">
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.body.innerHTML = "<div style='color: white; padding: 20px; background: red; z-index: 99999; position: relative;'><h1>GLOBAL SCRIPT ERROR</h1><p>" + msg + "</p><pre>" + (error && error.stack) + "</pre></div>";
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = "<div style='color: white; padding: 20px; background: red; z-index: 99999; position: relative;'><h1>UNHANDLED PROMISE REJECTION</h1><p>" + event.reason + "</p></div>";
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
